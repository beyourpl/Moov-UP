services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
      - ./backend/data:/app/data
      - hf_cache:/root/.cache/huggingface
      - sqlite_data:/app/db
    env_file: ./backend/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    # Aligné avec vite.config.js : sans ça, Vite peut prendre le port 3000 alors que compose mappe 5173 → ERR_EMPTY_RESPONSE.
    environment:
      VITE_BIND_HOST: "0.0.0.0"
      VITE_DEV_PORT: "5173"
      # Front : le navigateur doit appeler /api en relatif (même origine). Ne pas mettre localhost:8000 ici
      # (le client s’exécute chez l’utilisateur). Vite proxifie /api → backend via VITE_API_PROXY_TARGET.
      VITE_API_PROXY_TARGET: http://backend:8000
      # Optionnel (racine .env) : ex. http://IP:8000 si tu ouvres le front sans proxy /api.
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PUBLIC_DOMAIN: ${VITE_PUBLIC_DOMAIN:-moovup.site}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend

volumes:
  hf_cache:
  sqlite_data:
