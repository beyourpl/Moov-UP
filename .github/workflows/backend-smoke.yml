# Vérifie que l'image backend démarre et répond à /api/health (sans VPS).
name: Backend smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.ci.yml"
      - ".github/workflows/backend-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & start backend
        run: |
          set -euo pipefail
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.ci.yml build backend
          docker compose -f docker-compose.ci.yml up -d backend
          sleep 5
          docker compose -f docker-compose.ci.yml ps -a
          docker compose -f docker-compose.ci.yml logs backend --tail 80 || true
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then
              echo ""
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.ci.yml logs backend --tail 120
          exit 1

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
